#Config file for

[input]
entrypoint = 0x80061600
# Paths are relative to the location of this config file.
elf_path = "build/kengriffeyslugfest.elf"
directory = "output"
output_func_path = "../RecompiledFuncs"

manual_funcs = [
]

[patches]
stubs = [
]

ignored = [
# Unreferenced duplicate of osGetCount (mfc0 Count). All other libultra
# functions are named in symbol_addrs.txt and handled by N64Recomp's built-in lists.
"boot_GetCount",
# Boot loader's osPiRawStartDma; implemented natively as a ROM read in SlugfestRecomp.
"boot_osPiRawStartDma",
# Static libultra PFS helpers N64Recomp doesn't list. They call PFS internals that
# N64Recomp ignores, and they're only reachable from the reimplemented osPfs* functions.
"__osPfsDeclearPage",
"__osClearPage",
"__osPfsReleasePages",
"__osBlockSum",
"__osSumcalc",
"__osIdCheckSum",
# Only called by osSpTaskLoad, which N64ModernRuntime reimplements.
"_VirtualToPhysicalTask",
# Small data tables embedded in handwritten audio code in toplevel's .text (see the
# instruction patches below); not code.
"func_8007926C",
"func_80079328"
]

# Hooks

# Single-instruction patches
# Handwritten code in toplevel (0x80079180-0x80079790) gets the address of an embedded table
# or code fragment PC-relatively: `bltzal $zero, X` (never taken, but sets $ra) followed by
# `addiu $reg, $ra, imm`. N64Recomp doesn't set $ra for an untaken branch-and-link, so
# replace the pair with `lui $reg, %hi(X)` / `addiu $reg, $reg, %lo(X)`.

# $t7 = 0x8007926C
[[patches.instruction]]
func = "func_80079180"
vram = 0x80079190
value = 0x3C0F8008 # lui $t7, 0x8008

[[patches.instruction]]
func = "func_80079180"
vram = 0x80079198
value = 0x25EF926C # addiu $t7, $t7, 0x926C

# $t0 = 0x80079328
[[patches.instruction]]
func = "func_80079274"
vram = 0x8007929C
value = 0x3C088008 # lui $t0, 0x8008

[[patches.instruction]]
func = "func_80079274"
vram = 0x800792A4
value = 0x25089328 # addiu $t0, $t0, 0x9328

