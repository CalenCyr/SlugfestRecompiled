# Game code that builds uncached (KSEG1) aliases of its own RAM, mostly framebuffers:
# `lui $reg, 0xA000` then `or $dst, $ptr, $reg`. N64ModernRuntime only maps KSEG0, so an
# 0xA0xxxxxx address would fault. Build the cached alias (0x80000000) instead; it's the same RDRAM.

[[patches.instruction]]
func = "func_8006C718"
vram = 0x8006C728
value = 0x3C018000 # lui $at, 0x8000 (was 0xA000)

[[patches.instruction]]
func = "func_8006C758"
vram = 0x8006C830
value = 0x3C018000 # lui $at, 0x8000 (was 0xA000)

[[patches.instruction]]
func = "func_80075910"
vram = 0x80075920
value = 0x3C018000 # lui $at, 0x8000 (was 0xA000)

[[patches.instruction]]
func = "func_80077714"
vram = 0x80077730
value = 0x3C058000 # lui $a1, 0x8000 (was 0xA000)

[[patches.instruction]]
func = "func_80077778"
vram = 0x80077794
value = 0x3C088000 # lui $t0, 0x8000 (was 0xA000)

[[patches.instruction]]
func = "func_8011CC00"
vram = 0x8011CCAC
value = 0x3C018000 # lui $at, 0x8000 (was 0xA000)

[[patches.instruction]]
func = "func_8012D2E4"
vram = 0x8012D314
value = 0x3C088000 # lui $t0, 0x8000 (was 0xA000)

# func_80199BA0_frontend also builds an 0xA0000000 address, but it's a cartridge-bus (flash) base
# address, not RAM, and nothing calls the function, so it's deliberately left unpatched.

# Overlay registration hooks (implemented in SlugfestRecomp/src/game/overlays.cpp).
# The game decompresses its code modules from ROM itself, so N64ModernRuntime never sees a ROM DMA
# it can match to a section; tell it directly which module was loaded.

# boot_main has just decompressed toplevel and is about to jump to it.
[[patches.hook]]
func = "boot_main"
before_vram = 0x80061850
text = "{ extern void slugfest_on_toplevel_loaded(uint8_t*, recomp_context*); slugfest_on_toplevel_loaded(rdram, ctx); }"

# load_code(file_index, dest): entry of toplevel's code-module loader. $a0/$a1 are still the arguments.
[[patches.hook]]
func = "func_80071708"
before_vram = 0x80071708
text = "{ extern void slugfest_on_load_code(uint8_t*, recomp_context*); slugfest_on_load_code(rdram, ctx); }"

# Graphics scheduler (toplevel's modified libultra sched.c, scheduling at func_8007572C): it starts the
# next graphics task as soon as the RSP is free and no buffer swap is pending, without checking that the
# RDP has finished the previous one (sc->curRDPTask, 0x278). On hardware the RDP always finishes first,
# but N64ModernRuntime reports RSP completion before RT64 has rendered the frame, so the next task
# overwrote curRDPTask and the second RDP-done tripped `assert(sc->curRDPTask)` (sched.c:494).
# After the gfx-ready check returns, treat the task as not ready while the RDP is busy (as stock sched.c does).
[[patches.hook]]
func = "func_8007572C"
before_vram = 0x80075760
text = "if (MEM_W(0x278, MEM_W(0x20, ctx->r29)) != 0) { ctx->r2 = 0; }"

# __scTaskComplete (func_800753A0) sends each finished task's reply with OS_MESG_BLOCK. The intro's
# first graphics task of each frame replies to D_80090770, which the game never reads: on hardware
# that task's display list doesn't end in a full sync, so the RDP never interrupts for it and the
# reply is never sent. N64ModernRuntime signals RDP completion for every gfx task, so the queue
# fills after 8 frames and the scheduler blocks forever. Send replies with OS_MESG_NOBLOCK instead;
# queues the game actually drains never fill, so only the unread replies are dropped.
[[patches.instruction]]
func = "func_800753A0"
vram = 0x800753FC
value = 0x24060000 # addiu $a2, $zero, 0 (OS_MESG_NOBLOCK, was 1)

# func_8006EA30 (used when leaving attract mode and on other mode changes) busy-waits for each
# sound player to stop: `while (func_8007CA80(player)) {}`. On hardware interrupts pre-empt the
# loop; N64ModernRuntime only switches game threads at OS calls, so the loop starved the threads
# that update the player state. Let the runtime deliver events / switch threads on each pass.
[[patches.hook]]
func = "func_8006EA30"
before_vram = 0x8006EAF4
text = "{ extern void slugfest_yield_1ms(uint8_t*); slugfest_yield_1ms(rdram); }"

# Frame submit (func_8012D2E4): cap the frame rate (see SlugfestRecomp/src/game/frame_pacing.cpp).
# The game steps its logic by a fixed amount per frame and ran too fast at the 60 frames per second
# recompiled code can reach.
[[patches.hook]]
func = "func_8012D2E4"
before_vram = 0x8012D2E4
text = "{ extern void slugfest_pace_frame(uint8_t*, recomp_context*); slugfest_pace_frame(rdram, ctx); }"

# Camera setup (func_8012780C): widen the horizontal culling planes to the window's aspect ratio
# with Expand, so models near the sides of a widescreen view aren't culled (see
# SlugfestRecomp/src/game/aspect_ratio.cpp). The first hook runs before the jal to func_801279E8,
# the second after it returns.
[[patches.hook]]
func = "func_8012780C"
before_vram = 0x80127944
text = "{ extern void slugfest_widen_culling(uint8_t*, recomp_context*); slugfest_widen_culling(rdram, ctx); }"

[[patches.hook]]
func = "func_8012780C"
before_vram = 0x8012794C
text = "{ extern void slugfest_restore_culling(uint8_t*, recomp_context*); slugfest_restore_culling(rdram, ctx); }"
